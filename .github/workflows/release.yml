name: Release

# Pushing a tag such as v0.3.0 builds Rig for Linux and macOS (amd64 and
# arm64), writes SHA256SUMS, and publishes a GitHub release. install.sh and
# 'rig update' download from it and check every file against SHA256SUMS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache: false   # a release builds from a clean module cache

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/rig-$os-$arch" ./cmd/rig
          done
          cd dist && sha256sum rig-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "Rig $VERSION" --generate-notes
