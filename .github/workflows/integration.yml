name: Integration

# End-to-end checks against a real engine: Docker with gVisor installed and
# direct internet access, so every security level (lockdown included) runs the
# way users run it, and the Claude Code image is built for real.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Docker with gVisor: every level, lockdown included.
          - engine: docker
            gvisor: true
            skip: ""
          # Rootless Podman (installed on the runner) without gVisor.
          - engine: podman
            gvisor: false
            skip: gvisor
    name: ${{ matrix.engine }}${{ matrix.gvisor && ' + gVisor' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RIG_ENGINE: ${{ matrix.engine }}
      RIG_IT_SKIP: ${{ matrix.skip }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install gVisor
        if: matrix.gvisor
        env:
          # A pinned release, checked against its published SHA-512.
          GVISOR_RELEASE: "20261026.0"
          GVISOR_SHA512: 26e4a327565f5da0f73261a6387e2c20f4695a232e330095a3111b70efd604fdf09d734e8cc8f714dbb5c5607ce8c87ea80b26df549d83a146f2efd5a1af448a
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o gvisor.tar.bz2 \
            "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  gvisor.tar.bz2" | sha512sum -c -
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info --format 'runtimes: {{range $name, $_ := .Runtimes}}{{$name}} {{end}}'
          runsc --version

      - name: Build rig
        run: go build -o bin/rig ./cmd/rig

      - name: Integration tests
        run: scripts/integration-test.sh bin/rig
