name: Integration

# End-to-end checks against a real engine: Docker with gVisor installed and
# direct internet access, so every security level (lockdown included) runs the
# way users run it, and the Claude Code image is built for real.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-gvisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install gVisor
        run: |
          arch="$(uname -m)"
          url="https://storage.googleapis.com/gvisor/releases/release/latest/${arch}"
          cd "$RUNNER_TEMP"
          for f in runsc runsc.sha512 containerd-shim-runsc-v1 containerd-shim-runsc-v1.sha512; do
            curl -fsSL --retry 3 -o "$f" "$url/$f"
          done
          sha512sum -c runsc.sha512 containerd-shim-runsc-v1.sha512
          chmod a+rx runsc containerd-shim-runsc-v1
          sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin/
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info --format 'runtimes: {{range $name, $_ := .Runtimes}}{{$name}} {{end}}'
          runsc --version

      - name: Build rig
        run: go build -o bin/rig ./cmd/rig

      - name: Integration tests
        run: scripts/integration-test.sh bin/rig
